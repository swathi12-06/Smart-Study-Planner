<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <button id="themeToggle" class="theme-btn">🌙</button>

  <div class="app">
    <header>
      <div>
        <h1>Smart Study Planner</h1>
        <p class="lead">Plan study goals, get reminders & track progress.</p>
      </div>
      <div class="controls">
        <input id="searchBox" class="search" placeholder="Search tasks...">
        <select id="sort">
          <option value="date">Sort by Due Date</option>
          <option value="priority">Sort by Priority</option>
          <option value="alpha">Sort A-Z</option>
        </select>
        <button id="clearAll" class="btn ghost small">Clear All</button>
      </div>
    </header>

    <div class="layout">
      <aside class="card fade-up">
        <h3>Add / Edit Task</h3>
        <form id="taskForm">
          <input type="hidden" id="taskId">

          <label>Title<input id="title" required></label>
          <label>Subject<input id="subject"></label>
          <label>Due date & time<input id="due" type="datetime-local"></label>

          <div class="row">
            <label style="flex:1">Duration (min)
              <input id="duration" type="number">
            </label>

            <label style="width:120px">Priority
              <select id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>

          <label>Notes<textarea id="notes"></textarea></label>

          <label>Progress
            <input id="progress" type="range" min="0" max="100" value="0">
          </label>

          <div style="display:flex;gap:8px;margin-top:10px">
            <button type="submit" class="btn">Save Task</button>
            <button id="reset" type="button" class="btn ghost">Reset</button>
          </div>
        </form>
      </aside>

      <main>
        <div class="card">
          <div class="board-head">
            <strong id="summary">0 tasks</strong>

            <div>
              <select id="filter">
                <option value="all">All</option>
                <option value="today">Today</option>
                <option value="week">This week</option>
                <option value="high">High priority</option>
                <option value="completed">Completed</option>
                <option value="incomplete">Incomplete</option>
              </select>
            </div>
          </div>

          <div class="tasks" id="tasks"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
